name: Publish to PyPI

# Release-sync gate (SPEC 3.2): Gate A runs the full fail-closed check
# set on the exact tree being released before anything builds; Gate B
# re-checks the built artifacts before the upload step. A gate failure
# stops the release — nothing reaches PyPI. Manual dispatch is guarded
# (check G9): it must name a tag and the expected version.

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Version the dispatched tag must declare in pyproject.toml"
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  gate-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gate tools
        run: pip install "pytest>=8"
      - name: Release-sync Gate A (pre-build, fail-closed)
        env:
          RS_EVENT_NAME: ${{ github.event_name }}
          RS_REF: ${{ github.ref }}
          RS_RELEASE_TAG: ${{ github.event.release.tag_name }}
          RS_EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: python tools/release_sync.py check --gate-a --event-env

  publish:
    needs: gate-a
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chancellor
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Release-sync Gate B (post-build, pre-upload)
        run: python tools/release_sync.py check --gate-b dist/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
