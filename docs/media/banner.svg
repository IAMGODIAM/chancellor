<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Chancellor banner / social preview. E5 palette canon: ink black ground,
       antique gold rule, ivory text, midnight navy depth band. No brown, ever. -->
  <rect width="1280" height="640" fill="#0a0a0e"/>
  <rect x="0" y="0" width="1280" height="10" fill="#0b1f3a"/>
  <rect x="0" y="630" width="1280" height="10" fill="#0b1f3a"/>
  <rect x="36" y="36" width="1208" height="568" fill="none" stroke="#c9a84c" stroke-width="2"/>
  <rect x="46" y="46" width="1188" height="548" fill="none" stroke="#c9a84c" stroke-width="0.75" opacity="0.55"/>

  <text x="640" y="196" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" letter-spacing="7" fill="#c9a84c">THE GOVERNANCE-AND-EVAL HARNESS</text>
  <text x="640" y="238" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" letter-spacing="7" fill="#c9a84c">FOR LONG-RUNNING AGENTS</text>

  <text x="640" y="368" text-anchor="middle" font-family="DejaVu Serif, serif" font-weight="bold" font-size="104" letter-spacing="10" fill="#f5efe1">CHANCELLOR</text>

  <line x1="390" y1="416" x2="612" y2="416" stroke="#c9a84c" stroke-width="2"/>
  <rect x="632" y="408" width="16" height="16" transform="rotate(45 640 416)" fill="#c9a84c"/>
  <line x1="668" y1="416" x2="890" y2="416" stroke="#c9a84c" stroke-width="2"/>

  <text x="640" y="478" text-anchor="middle" font-family="DejaVu Serif, serif" font-style="italic" font-size="31" fill="#f5efe1">Work is graded. Authority is gated.</text>
  <text x="640" y="522" text-anchor="middle" font-family="DejaVu Serif, serif" font-style="italic" font-size="31" fill="#f5efe1">Every decision leaves a receipt.</text>

  <text x="640" y="572" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="20" letter-spacing="2" fill="#ecd9a4">muse-spark-1.3 works &#183; muse-wonder-1.0 grades</text>
</svg>
